<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Chatbot</title>
    <style>
        #feedback-container { display: none; }
    </style>
</head>
<body>
    <h1>Hotel Booking Chatbot</h1>
    <div id="chat-container">
        <div id="chat-messages"></div>
        <form id="user-id-form">
            <input type="text" id="user-id-input" placeholder="Enter your user ID (e.g., user_001)" required>
            <button type="submit">Submit</button>
        </form>
        <form id="chat-form" style="display: none;">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <div id="feedback-container">
        <h2>Feedback</h2>
        <form id="feedback-form">
            <input type="hidden" id="user_input" name="user_input">
            <label for="predicted_intent">Predicted Intent:</label>
            <input type="text" id="predicted_intent" name="predicted_intent" readonly>
            <label for="correct_intent">Correct Intent:</label>
            <select id="correct_intent" name="correct_intent">
                <option value="book_room">Book Room</option>
                <option value="extend_stay">Extend Stay</option>
                <option value="room_info">Room Info</option>
                <option value="cancel_booking">Cancel Booking</option>
                <option value="out_of_scope">Out of Scope</option>
                <option value="multi_room_booking">Multi-Room Booking</option>
                <option value="user_identification">User Identification</option>
            </select>
            <button type="submit">Submit Feedback</button>
        </form>
    </div>

    <script>
        const userIdForm = document.getElementById('user-id-form');
        const userIdInput = document.getElementById('user-id-input');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatMessages = document.getElementById('chat-messages');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackForm = document.getElementById('feedback-form');
        let userId = '';

        userIdForm.addEventListener('submit', (e) => {
            e.preventDefault();
            userId = userIdInput.value.trim();
            if (userId) {
                userIdForm.style.display = 'none';
                chatForm.style.display = 'block';
                displayMessage('Bot', `Thank you for providing your user ID: ${userId}. How can I assist you today?`);
            }
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (message) {
                displayMessage('You', message);
                userInput.value = '';
                
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: message, user_id: userId }),
                });
                
                const data = await response.json();
                displayMessage('Bot', data.response);

                if (data.requires_feedback) {
                    showFeedbackForm(message, data.predicted_intent);
                }
            }
        });

        feedbackForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(feedbackForm);
            
            try {
                const response = await fetch('/submit_feedback', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.text();
                feedbackContainer.style.display = 'none';
                displayMessage('Bot', data);
            } catch (error) {
                console.error('Error:', error);
                displayMessage('Bot', 'An error occurred while submitting feedback. Please try again.');
            }
        });

        function displayMessage(sender, message) {
            const messageElement = document.createElement('p');
            messageElement.textContent = `${sender}: ${message}`;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showFeedbackForm(userInput, predictedIntent) {
            document.getElementById('user_input').value = userInput;
            document.getElementById('predicted_intent').value = predictedIntent;
            feedbackContainer.style.display = 'block';
        }

        // Initial bot message
        displayMessage('Bot', 'Welcome to the Hotel Booking Service! Please enter your user ID to get started.');
    </script>
</body>
</html>
